<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вопрос {{.Current}} из {{.Total}}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <div class="card fade-in">
            <div class="quiz-header">
                <span class="question-counter">Вопрос {{.Current}} из {{.Total}}</span>
                <a href="/logout" class="logout-btn-small">🚪 Выйти</a>
            </div>
            <h2>{{.Question.Text}}</h2>
            <form action="/answer" method="POST" id="question-form">
                <input type="hidden" name="qid" value="{{.Question.ID}}">
                <div class="options">
                    {{range $i, $opt := .Question.Options}}
                    <label class="option">
                        <input type="radio" name="choice" value="{{$i}}" required>
                        <span>{{$opt}}</span>
                    </label>
                    {{end}}
                </div>
                <button type="submit" class="btn">Ответить →</button>
            </form>
        </div>
    </div>
    <script src="/static/js/cursor.js"></script>
</body>
</html>
